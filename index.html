      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      a,
      button,
      summary,
      .tab,
      .btn,
      .card,
      .tut,
      .dl-card,
      .brand,
      .lang-btn,
      .icon-btn,
      .bar,
      .play,
      .badge,
      .foot-links a {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      ::selection {
        background: rgba(118, 23, 245, 0.18);
      }
      html {
        scroll-behavior: auto;
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--font);
        color: var(--ink);
        background: #fff;
        line-height: 1.75;
        font-size: 16px;
        overflow-x: hidden;
      }
      img,
      svg {
        display: block;
        max-width: 100%;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--cyan);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .container {
        width: 100%;
        max-width: var(--max);
        margin-inline: auto;
        padding-inline: 20px;
      }
      .ic {
        display: inline-flex;
        width: 24px;
        height: 24px;
      }
      .ic svg {
        width: 100%;
        height: 100%;
      }
      .logo-img {
        display: inline-block;
        flex: none;
        width: 22px;
        height: 22px;
        background: var(--logo) center/contain no-repeat;
      }

      /* =========================================================
   BUTTONS
   ========================================================= */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 48px;
        padding: 0 26px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 16px;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          background 0.2s,
          border-color 0.2s;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--grad);
        color: #fff;
        box-shadow: 0 10px 24px -8px rgba(118, 23, 245, 0.55);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 30px -8px rgba(118, 23, 245, 0.6);
      }
      .btn-ghost {
        background: #fff;
        color: var(--purple);
        border: 1.5px solid var(--line);
      }
      .btn-ghost:hover {
        border-color: var(--purple);
        background: var(--lavender);
      }
      .btn-light {
        background: #fff;
        color: var(--purple);
      }
      .btn-light:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 26px -8px rgba(0, 0, 0, 0.3);
      }
      .btn-outline-light {
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        color: #fff;
      }
      .btn-outline-light:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .btn[disabled] {
        background: var(--lavender);
        color: var(--gray);
        border: 1.5px dashed #cfc7e8;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }
      .btn-sm {
        min-height: 40px;
        padding: 0 18px;
        font-size: 15px;
        border-radius: 12px;
      }
      .btn .ic {
        width: 20px;
        height: 20px;
      }

      /* =========================================================
   TOP BAR + BOTTOM BAR (same design, same height: --bar-h)
   ========================================================= */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        padding: 8px 12px 0;
        pointer-events: none;
      }
      .bar {
        pointer-events: auto;
        height: var(--bar-h);
        width: 100%;
        max-width: 520px;
        margin-inline: auto;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 14px 36px -8px rgba(17, 20, 38, 0.28);
      }
      .nav-in {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: 0.2px;
      }
      .brand .logo-img {
        width: 26px;
        height: 26px;
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lang-btn {
        min-width: 48px;
        height: 36px;
        padding: 0 12px;
        border-radius: 99px;
        border: 1.5px solid var(--line);
        font-size: 13px;
        font-weight: 700;
        color: var(--purple);
        transition: 0.2s;
      }
      .lang-btn:hover {
        background: var(--lavender);
        border-color: var(--purple);
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #25d366;
        color: #fff;
        transition: transform 0.2s;
      }
      .icon-btn:hover {
        transform: scale(1.08);
      }
      .icon-btn .ic {
        width: 20px;
        height: 20px;
      }

      /* Report link (lives in the footer, not floating over the content) */
      .report-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        color: #b9bdd3;
        font-size: 14px;
        font-weight: 600;
        padding: 6px 0;
        transition: color 0.2s;
      }
      .report-link:hover {
        color: var(--cyan);
      }
      .report-link .ic {
        width: 18px;
        height: 18px;
      }

      /* =========================================================
   BOTTOM TAB BAR (main navigation)
   ========================================================= */
      .tabbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        display: flex;
        justify-content: center;
        padding: 0 12px calc(8px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .tabbar-in {
        display: flex;
        align-items: stretch;
        gap: 2px;
        padding: 5px;
      }
      .tab {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        border-radius: 16px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--gray);
        transition:
          background 0.2s,
          color 0.2s;
      }
      .tab .ic {
        width: 22px;
        height: 22px;
      }
      .tab span:last-child {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .tab:hover {
        color: var(--purple);
        background: var(--lavender);
      }
      .tab.active {
        color: #fff;
        background: var(--grad);
        box-shadow: 0 8px 18px -8px rgba(118, 23, 245, 0.7);
      }

      /* =========================================================
   ROUTER / PAGES
   ========================================================= */
      .page {
        display: none;
      }
      .page.active {
        display: block;
        animation: pageIn 0.45s ease both;
      }
      @keyframes pageIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      main:focus {
        outline: none;
      }

      .section {
        padding: 80px 0;
      }
      .section-alt {
        background: var(--lavender);
      }
      .eyebrow {
        display: inline-block;
        color: var(--purple);
        font-weight: 700;
        font-size: 14px;
        background: rgba(118, 23, 245, 0.08);
        padding: 4px 14px;
        border-radius: 99px;
        margin-bottom: 14px;
      }
      .h2 {
        font-size: clamp(26px, 4vw, 38px);
        line-height: 1.35;
        font-weight: 800;
        margin-bottom: 12px;
      }
      .lead {
        color: var(--gray);
        font-size: 18px;
        max-width: 640px;
      }
      .center {
        text-align: center;
      }
      .center .lead {
        margin-inline: auto;
      }
      .sec-head {
        margin-bottom: 48px;
      }

      /* =========================================================
   HOME
   ========================================================= */
      .hero {
        position: relative;
        overflow: hidden;
        padding: calc(var(--bar-h) + 8px + 40px) 0 88px;
        background:
          radial-gradient(700px 380px at 12% 8%, rgba(160, 32, 240, 0.14), transparent 70%),
          radial-gradient(600px 360px at 92% 30%, rgba(39, 200, 232, 0.16), transparent 70%), #fff;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 48px;
        align-items: center;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 99px;
        background: #fff;
        border: 1px solid var(--line);
        font-size: 14px;
        font-weight: 600;
        color: var(--purple);
        box-shadow: var(--shadow-sm);
        margin-bottom: 22px;
      }
      .pill i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cyan);
      }
      .hero h1 {
        font-size: clamp(34px, 5.4vw, 58px);
        line-height: 1.25;
        font-weight: 800;
        margin-bottom: 20px;
      }
      .hero h1 em {
        font-style: normal;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero p.sub {
        font-size: 18px;
        color: var(--gray);
        max-width: 520px;
        margin-bottom: 32px;
      }
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .preview-wrap {
        position: relative;
      }
      .preview-wrap::before {
        content: "";
        position: absolute;
        inset: 6% -4% -6% 4%;
        background: var(--grad);
        opacity: 0.14;
        filter: blur(40px);
        border-radius: 40px;
        z-index: 0;
      }
      .device {
        position: relative;
        z-index: 1;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }
      .device-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px 16px;
        background: var(--lavender);
        border-bottom: 1px solid var(--line);
      }
      .device-bar i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d6cdee;
      }
      .device-bar span {
        margin-inline-start: auto;
        font-size: 12px;
        color: var(--gray);
      }
      /* SCREENSHOT SLOT: set CONFIG.screenshots.home in the script to show a real screenshot here */
      .shot-slot img {
        width: 100%;
        height: auto;
      }
      .app {
        display: grid;
        grid-template-columns: 150px 1fr;
        min-height: 340px;
        font-size: 13px;
      }
      .app-side {
        background: #111426;
        color: #c9cde0;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .app-side .app-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        font-weight: 800;
        margin-bottom: 14px;
        font-size: 15px;
      }
      .app-side .app-logo .logo-img {
        width: 24px;
        height: 24px;
      }
      .app-side a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        font-weight: 600;
        pointer-events: none;
      }
      .app-side a .ic {
        width: 16px;
        height: 16px;
      }
      .app-side a.on {
        background: rgba(160, 32, 240, 0.3);
        color: #fff;
      }
      .app-main {
        padding: 16px;
        background: #fbfaff;
        min-width: 0;
      }
      .app-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        gap: 8px;
      }
      .app-top b {
        font-size: 15px;
      }
      .demo-tag {
        font-size: 11px;
        padding: 2px 10px;
        border-radius: 99px;
        background: rgba(39, 200, 232, 0.15);
        color: #0b8aa6;
        font-weight: 700;
        white-space: nowrap;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .stat small {
        color: var(--gray);
        display: block;
        font-size: 11px;
      }
      .stat strong {
        font-size: 17px;
        display: block;
        line-height: 1.5;
      }
      .stat .up {
        font-size: 11px;
        color: #0b8aa6;
        font-weight: 700;
      }
      .panels {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 10px;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        min-width: 0;
      }
      .panel h4 {
        font-size: 12px;
        margin-bottom: 10px;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 7px;
        height: 96px;
      }
      .bars i {
        flex: 1;
        border-radius: 6px 6px 2px 2px;
        background: linear-gradient(180deg, #a020f0, #7617f5);
        opacity: 0.9;
      }
      .bars i:nth-child(even) {
        background: linear-gradient(180deg, #27c8e8, #7617f5);
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        gap: 6px;
      }
      .row span:last-child {
        color: var(--gray);
        white-space: nowrap;
      }
      .meter {
        height: 5px;
        border-radius: 9px;
        background: var(--lavender);
        overflow: hidden;
        margin-top: 3px;
      }
      .meter i {
        display: block;
        height: 100%;
        background: var(--grad);
        border-radius: 9px;
      }
      .float-chip {
        position: absolute;
        z-index: 2;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 14px;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 13px;
      }
      .float-chip .ic {
        width: 34px;
        height: 34px;
        padding: 7px;
        border-radius: 10px;
        background: var(--grad);
        color: #fff;
      }
      .float-chip.c2 .ic {
        background: linear-gradient(135deg, #27c8e8, #7617f5);
      }
      .float-chip.c1 {
        inset-block-end: -18px;
        inset-inline-start: -14px;
      }
      .float-chip.c2 {
        inset-block-start: 34px;
        inset-inline-end: -14px;
      }
      .note {
        font-size: 12px;
        color: var(--gray);
        margin-top: 30px;
        text-align: center;
      }

      .cards-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 28px;
        transition:
          transform 0.25s,
          box-shadow 0.25s,
          border-color 0.25s;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow);
        border-color: #d9cdf5;
      }
      .icon-box {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: rgba(118, 23, 245, 0.09);
        color: var(--purple);
        margin-bottom: 18px;
      }
      .icon-box .ic {
        width: 26px;
        height: 26px;
      }
      .icon-box.cy {
        background: rgba(39, 200, 232, 0.14);
        color: #0b8aa6;
      }
      .card h3 {
        font-size: 20px;
        margin-bottom: 8px;
      }
      .card p {
        color: var(--gray);
        font-size: 16px;
      }

      .cta-band {
        margin: 0 auto;
        border-radius: 32px;
        padding: 64px 28px;
        text-align: center;
        color: #fff;
        position: relative;
        overflow: hidden;
        background: var(--grad);
      }
      .cta-band::before {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(39, 200, 232, 0.5), transparent 70%);
        inset-block-start: -180px;
        inset-inline-start: -120px;
      }
      .cta-band > * {
        position: relative;
      }
      .cta-band h2 {
        font-size: clamp(26px, 4vw, 38px);
        line-height: 1.35;
        margin-bottom: 12px;
      }
      .cta-band p {
        opacity: 0.9;
        font-size: 18px;
        max-width: 560px;
        margin: 0 auto 28px;
      }
      .cta-band .cta-row {
        justify-content: center;
      }

      /* =========================================================
   GALLERY (app screenshots, images/ folder)
   ========================================================= */
      .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 22px;
      }
      .shot {
        margin: 0;
        border-radius: var(--r-lg);
        overflow: hidden;
        border: 1px solid var(--line);
        background: #fff;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .shot:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow);
      }
      .shot img {
        width: 100%;
        height: auto;
        display: block;
      }
      @media (max-width: 640px) {
        .gallery {
          display: flex;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          gap: 14px;
          margin-inline: -16px;
          padding: 4px 16px 18px;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
        }
        .gallery::-webkit-scrollbar {
          display: none;
        }
        .shot {
          flex: 0 0 84%;
          scroll-snap-align: center;
        }
      }

      /* =========================================================
   FEATURES + TUTORIALS
   ========================================================= */
      .page-hero {
        padding: calc(var(--bar-h) + 8px + 40px) 0 48px;
        text-align: center;
        background:
          radial-gradient(600px 300px at 50% -10%, rgba(160, 32, 240, 0.14), transparent 70%),
          radial-gradient(400px 240px at 90% 60%, rgba(39, 200, 232, 0.12), transparent 70%), #fff;
      }
      .page-hero h1 {
        font-size: clamp(30px, 5vw, 48px);
        line-height: 1.3;
        font-weight: 800;
        margin-bottom: 14px;
      }
      .page-hero p {
        color: var(--gray);
        font-size: 18px;
        max-width: 640px;
        margin-inline: auto;
      }
      .feat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .feat-grid .card {
        padding: 24px;
      }
      .feat-grid .card h3 {
        font-size: 18px;
      }
      .feat-grid .card p {
        font-size: 15px;
      }
      .tut-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .tut {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .tut:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow);
      }
      /* THUMBNAIL PLACEHOLDER: set "thumb" in CONFIG.tutorials to an image path to use a real thumbnail */
      .thumb {
        position: relative;
        aspect-ratio: 9/16;
        width: 100%;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: none;
        background: linear-gradient(135deg, #2a0b63, #7617f5 60%, #27c8e8);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .thumb::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(300px 140px at 80% 10%, rgba(255, 255, 255, 0.18), transparent 70%);
      }
      .thumb iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        z-index: 3;
        background: #000;
      }
      .thumb.playing {
        cursor: default;
      }
      .thumb.playing > div,
      .thumb.playing iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        background: #000;
      }
      .thumb.failed {
        background: #111426;
      }
      .yt-fail {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        color: #fff;
        background: #111426;
      }
      .yt-fail p {
        color: #d7daea;
        font-size: 15px;
        font-weight: 600;
        max-width: none;
      }
      .ask {
        max-width: 640px;
        margin-inline: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 26px 22px;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
      .ask h2 {
        font-size: 22px;
      }
      .ask p {
        color: var(--gray);
        font-size: 15px;
        max-width: none;
      }
      .ask textarea {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        padding: 14px 16px;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        font: inherit;
        font-size: 16px;
        color: var(--ink);
        background: var(--lavender);
        outline: none;
        text-align: start;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .ask textarea:focus {
        border-color: var(--purple);
        box-shadow: 0 0 0 4px rgba(118, 23, 245, 0.12);
        background: #fff;
      }
      .ask .btn {
        width: 100%;
      }
      .tut-search {
        position: relative;
        display: flex;
        align-items: center;
        margin-bottom: 26px;
      }
      .tut-search .ic {
        position: absolute;
        inset-inline-start: 16px;
        width: 20px;
        height: 20px;
        color: var(--gray);
        pointer-events: none;
      }
      .tut-search input {
        width: 100%;
        height: 52px;
        padding-inline: 46px 46px;
        border: 1.5px solid var(--line);
        border-radius: 99px;
        background: #fff;
        font: inherit;
        font-size: 16px;
        color: var(--ink);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        -webkit-appearance: none;
        appearance: none;
      }
      .tut-search input:focus {
        border-color: var(--purple);
        box-shadow: 0 0 0 4px rgba(118, 23, 245, 0.12);
      }
      .tut-search input::-webkit-search-cancel-button {
        display: none;
      }
      .tut-search button {
        position: absolute;
        inset-inline-end: 10px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 22px;
        line-height: 1;
        color: var(--gray);
        background: var(--lavender);
      }
      .tut-empty {
        text-align: center;
        color: var(--gray);
        font-weight: 600;
        padding: 30px 0;
      }
      .tut-note {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: var(--lavender);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 16px 18px;
        margin-bottom: 26px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
      }
      .tut-note .ic {
        width: 22px;
        height: 22px;
        flex: none;
        color: var(--purple);
        margin-top: 1px;
      }
      .thumb img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .play {
        position: relative;
        z-index: 1;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        color: var(--purple);
        display: grid;
        place-items: center;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
      }
      .play .ic {
        width: 24px;
        height: 24px;
        transform: translateX(-2px);
      }
      [dir="ltr"] .play .ic {
        transform: translateX(2px);
      }
      .badge {
        position: absolute;
        z-index: 2;
        inset-block-start: 12px;
        inset-inline-start: 12px;
        background: rgba(17, 20, 38, 0.7);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 12px;
        border-radius: 99px;
      }
      .tut-body {
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }
      .tut-body h3 {
        font-size: 18px;
      }
      .tut-body p {
        color: var(--gray);
        font-size: 15px;
        flex: 1;
      }
      .tut-body .btn {
        margin-top: 10px;
        width: 100%;
      }

      /* =========================================================
   DOWNLOAD
   ========================================================= */
      .dl-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
        max-width: 920px;
        margin-inline: auto;
      }
      .dl-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .dl-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow);
      }
      .dl-ic {
        width: 84px;
        height: 84px;
        margin: 0 auto 20px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--grad);
        box-shadow: 0 14px 28px -10px rgba(118, 23, 245, 0.5);
      }
      .dl-card.win .dl-ic {
        background: linear-gradient(135deg, #27c8e8, #7617f5);
      }
      .dl-ic .ic {
        width: 44px;
        height: 44px;
      }
      .dl-card h3 {
        font-size: 24px;
        margin-bottom: 6px;
      }
      .dl-card p {
        color: var(--gray);
        margin-bottom: 24px;
      }
      .dl-card .btn {
        width: 100%;
      }
      .guide-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
      .guide {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 30px;
      }
      .guide h3 {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        margin-bottom: 18px;
      }
      .guide h3 .ic {
        width: 40px;
        height: 40px;
        padding: 9px;
        border-radius: 12px;
        background: rgba(118, 23, 245, 0.09);
        color: var(--purple);
      }
      .steps {
        list-style: none;
        counter-reset: s;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .steps li {
        counter-increment: s;
        display: flex;
        gap: 14px;
        color: #2c3047;
      }
      .steps li::before {
        content: counter(s);
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--grad);
        color: #fff;
        font-weight: 800;
        font-size: 14px;
        display: grid;
        place-items: center;
        margin-top: 2px;
      }
      .dl-card .act-small {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 8px;
        margin: 14px 0 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--gray);
        text-align: start;
      }
      .act-small .ic {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--purple);
        margin-top: 3px;
      }
      .act-small a {
        color: var(--purple);
        font-weight: 800;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
        white-space: nowrap;
      }
      .guide .hint {
        margin-top: 18px;
        font-size: 14px;
        color: var(--gray);
        background: var(--lavender);
        padding: 12px 14px;
        border-radius: 12px;
      }
      .faq {
        max-width: 780px;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .faq details {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 0 22px;
        transition: border-color 0.2s;
      }
      .faq details[open] {
        border-color: #cdb7f7;
        box-shadow: var(--shadow-sm);
      }
      .faq summary {
        list-style: none;
        cursor: pointer;
        padding: 18px 0;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .faq summary::-webkit-details-marker {
        display: none;
      }
      .faq summary::after {
        content: "+";
        font-size: 24px;
        color: var(--purple);
        line-height: 1;
        transition: transform 0.25s;
      }
      .faq details[open] summary::after {
        transform: rotate(45deg);
      }
      .faq details p {
        padding: 0 0 20px;
        color: var(--gray);
      }
      .faq a {
        color: var(--purple);
        font-weight: 700;
      }

      /* =========================================================
   FOOTER (shared)
   ========================================================= */
      .footer {
        background: var(--ink);
        color: #b9bdd3;
        padding: 56px 0 130px;
      }
      .foot-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 40px;
        padding-bottom: 36px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .footer .brand {
        color: #fff;
        margin-bottom: 14px;
      }
      .footer p {
        max-width: 420px;
        font-size: 15px;
      }
      .foot-links {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .foot-links h4 {
        color: #fff;
        margin-bottom: 4px;
      }
      .foot-links a {
        width: fit-content;
        transition: color 0.2s;
      }
      .foot-links a:hover {
        color: var(--cyan);
      }
      .wa-btn {
        background: #25d366;
        color: #08331a;
        margin-top: 6px;
      }
      .foot-links a.wa-btn:hover {
        color: #08331a;
        transform: translateY(-2px);
      }
      .wa-num {
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.5px;
        direction: ltr;
        unicode-bidi: isolate;
      }
      .social {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .social a {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
      }
      .social a:hover {
        background: var(--purple);
      }
      .copy {
        padding-top: 22px;
        font-size: 14px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
      }
      .copy p {
        max-width: none;
      }
      .made a {
        color: #fff;
        font-weight: 800;
        border-bottom: 1.5px solid var(--cyan);
        padding-bottom: 1px;
        transition: color 0.2s;
      }

      /* =========================================================
   MODAL (missing download link)
   ========================================================= */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(17, 20, 38, 0.55);
        backdrop-filter: blur(4px);
      }
      .modal.open {
        display: flex;
        animation: pageIn 0.25s ease both;
      }
      .modal-box {
        background: #fff;
        border-radius: 28px;
        max-width: 420px;
        width: 100%;
        padding: 36px 28px;
        text-align: center;
        box-shadow: var(--shadow-lg);
      }
      .modal-box .m-ic {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        background: rgba(118, 23, 245, 0.1);
        color: var(--purple);
      }
      .modal-box .m-ic .ic {
        width: 32px;
        height: 32px;
      }
      .modal-box h3 {
        font-size: 22px;
        margin-bottom: 8px;
      }
      .modal-box p {
        color: var(--gray);
        margin-bottom: 22px;
      }

      /* =========================================================
   RESPONSIVE
   ========================================================= */
      @media (max-width: 1024px) {
        .hero-grid {
          grid-template-columns: 1fr;
          gap: 56px;

        .hero p.sub {

        .feat-grid {

        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const hasUrl = (u) => typeof u === "string" && u.trim() !== "";
      let currentRoute = "home";

      function renderFeatures() {
        document.getElementById("featGrid").innerHTML = CONFIG.features
          .map(
            (f, i) => `
    <article class="card">
      <div class="icon-box ${i % 2 ? "cy" : ""}"><span class="ic" data-icon="${esc(f.icon)}"></span></div>
      <h3>${esc(f[LANG].title)}</h3><p>${esc(f[LANG].desc)}</p>
    </article>`,
          )
          .join("");
      }
      /* ---------- Tutorial search (forgiving: ignores diacritics, hamza/alef/ya/ta-marbuta variants,
   the "ال" prefix, small typos, and also matches synonyms in each tutorial's "kw" list) ---------- */
      let TUT_Q = "";
      function norm(x) {
        return String(x || "")
          .toLowerCase()
          .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
          .replace(/[أإآٱ]/g, "ا")
          .replace(/ى/g, "ي")
          .replace(/ة/g, "ه")
          .replace(/ؤ/g, "و")
          .replace(/ئ/g, "ي")
          .replace(/[^a-z0-9\u0600-\u06FF\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }
      function stem(w) {
        if (/^[a-z]/.test(w)) {
          return w.length > 4 ? w.replace(/(ing|ed|es|s)$/, "") : w;
        }
        w = w.replace(/^(وال|بال|فال|لل|ال)/, "");
        return w.length > 3 ? w.replace(/(ات|ون|ين|ان|ها|ه|ي)$/, "") : w;
      }
      function editDist1(a, b) {
        if (Math.abs(a.length - b.length) > 1) return false;
        let i = 0,
          j = 0,
          e = 0;
        while (i < a.length && j < b.length) {
          if (a[i] === b[j]) {
            i++;
            j++;
            continue;
          }
          if (++e > 1) return false;
          if (a.length > b.length) i++;
          else if (a.length < b.length) j++;
          else {
            i++;
            j++;
          }
        }
        return e + (a.length - i) + (b.length - j) <= 1;
      }
      function tokenScore(q, words) {
        let best = 0;
        for (const w of words) {
          if (w === q) best = Math.max(best, 4);
          else if (w.startsWith(q)) best = Math.max(best, 3);
          else if (q.length >= 3 && w.includes(q)) best = Math.max(best, 2);
          else if (q.length >= 4 && w.length >= 4 && editDist1(q, w)) best = Math.max(best, 1);
        }
        return best;
      }
      function tutScore(x, query) {
        const qs = norm(query).split(" ").filter(Boolean).map(stem).filter(Boolean);
        if (!qs.length) return 1;
        const text = [x.ar.title, x.ar.desc, x.en.title, x.en.desc, x.kw].join(" ");
        const words = norm(text).split(" ").map(stem);
        const titleWords = norm(x.ar.title + " " + x.en.title)
          .split(" ")
          .map(stem);
        let total = 0;
        for (const q of qs) {
          const sc = tokenScore(q, words);
          if (!sc) return 0; // every typed word must match something
          total += sc + (tokenScore(q, titleWords) ? 2 : 0);
        }
        return total;
      }
      const ytUrl = (id) => "https://www.youtube.com/shorts/" + id;
      let _ytP = null;
      function loadYT() {
        if (window.YT && YT.Player) return Promise.resolve(window.YT);
        if (_ytP) return _ytP;
        _ytP = new Promise((res, rej) => {
          const prev = window.onYouTubeIframeAPIReady;
          window.onYouTubeIframeAPIReady = () => {
            if (prev) prev();
            res(window.YT);
          };
          const sc = document.createElement("script");
          sc.src = "https://www.youtube.com/iframe_api";
          sc.onerror = () => {
            _ytP = null;
            rej();
          };
          document.head.appendChild(sc);
          setTimeout(() => {
            if (!(window.YT && YT.Player)) {
              _ytP = null;
              rej();
            }
          }, 8000);
        });
        return _ytP;
      }
      function fallbackToYouTube(box, id) {
        box.classList.add("failed");
        box.innerHTML = `<div class="yt-fail"><p>${esc(t("tut.fail"))}</p><a class="btn btn-primary btn-sm" href="${ytUrl(id)}" target="_blank" rel="noopener">${esc(t("tut.yt"))}</a></div>`;
        const w = window.open(ytUrl(id), "_blank", "noopener"); // may be blocked on mobile: the button above is the backup
      }
      function renderTutorials() {
        const grid = document.getElementById("tutGrid");
        const list = CONFIG.tutorials.map((x, i) => ({ x, i, sc: tutScore(x, TUT_Q) })).filter((o) => o.sc > 0);
        if (TUT_Q.trim()) list.sort((a, b) => b.sc - a.sc || a.i - b.i);
        document.getElementById("tutEmpty").hidden = list.length > 0;
        document.getElementById("tutClear").hidden = !TUT_Q;
        grid.innerHTML = list
          .map(
            ({ x, i }) => `
    <article class="tut">
      <button class="thumb" type="button" data-i="${i}" aria-label="${esc(t("tut.watch"))}: ${esc(x[LANG].title)}">
        <img src="https://i.ytimg.com/vi/${esc(x.id)}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">
        <span class="badge">${esc(t("tut.video"))}</span>
        <span class="play"><span class="ic" data-icon="play"></span></span>
      </button>
      <div class="tut-body">
        <h3>${esc(x[LANG].title)}</h3><p>${esc(x[LANG].desc)}</p>
        <a class="btn btn-sm" href="https://www.youtube.com/shorts/${esc(x.id)}" target="_blank" rel="noopener">${esc(t("tut.yt"))}</a>
      </div>
    </article>`,
          )
          .join("");
        // click the thumbnail -> the video plays inside the card (stays on the site).
        // If YouTube refuses (embedding disabled, error, offline, or too slow) -> go to YouTube instead.
        grid.querySelectorAll(".thumb").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = CONFIG.tutorials[btn.dataset.i].id;
            // Pages opened as a local file can't embed YouTube (error 153): go straight to YouTube
            if (!/^https?:$/.test(location.protocol)) {
              window.open(ytUrl(id), "_blank", "noopener");
              return;
            }
            const box = document.createElement("div");
            box.className = "thumb playing";
            const mount = document.createElement("div");
            box.appendChild(mount);
            btn.replaceWith(box);
            loadYT()
              .then((YT) => {
                let done = false;
                const fail = () => {
                  if (done) return;
                  done = true;
                  clearTimeout(timer);
                  fallbackToYouTube(box, id);
                };
                const timer = setTimeout(fail, 8000); // never started playing
                new YT.Player(mount, {
                  videoId: id,
                  width: "100%",
                  height: "100%",
                  playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
                  events: {
                    onReady: (e) => {
                      try {
                        e.target.playVideo();
                      } catch (_) {}
                    },
                    onStateChange: (e) => {
                      if (e.data === 1 || e.data === 2 || e.data === 3) {
                        done = true;
                        clearTimeout(timer);
                      }
                    },
                    onError: fail,
                  },
                });
              })
              .catch(() => fallbackToYouTube(box, id));
          });
        });
      }
      document.getElementById("askForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const q = document.getElementById("askInput").value.trim();
        if (!q) return;
        const base = "https://wa.me/" + CONFIG.whatsapp.intl.replace(/\D/g, "");
        window.open(base + "?text=" + encodeURIComponent(t("faq.msg").replace("{q}", q)), "_blank", "noopener");
      });
      (function () {
        const inp = document.getElementById("tutSearch"),
          clr = document.getElementById("tutClear");
        inp.addEventListener("input", () => {
          TUT_Q = inp.value;
          renderTutorials();
          hydrateIcons();
        });
        clr.addEventListener("click", () => {
          inp.value = "";
          TUT_Q = "";
          renderTutorials();
          hydrateIcons();
          inp.focus();
        });
      })();
      function renderGallery() {
        const el = document.getElementById("gallery");
        if (!el) return;
        el.innerHTML = CONFIG.gallery
          .map(
            (g, i) => `
    <figure class="shot"><img src="${esc(g.src)}" width="${g.w}" height="${g.h}" alt="${esc(g[LANG])}" ${i ? 'loading="lazy"' : ""} decoding="async"></figure>`,
          )
          .join("");
      }
      function renderSocial() {
        const names = { facebook: "f", instagram: "ig", telegram: "tg", youtube: "yt" };
        const links = Object.entries(CONFIG.social).filter(([, u]) => hasUrl(u));
        document.getElementById("social").innerHTML = links
          .map(
            ([k, u]) =>
              `<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${esc(k)}">${names[k] || k}</a>`,
          )
          .join("");
      }
      function renderScreenshot() {
        if (!hasUrl(CONFIG.screenshots.home)) return;
        document.getElementById("shotHome").innerHTML = `<img src="${esc(CONFIG.screenshots.home)}" alt="Cashier">`;
      }
      function setWhatsApp() {
        const base = "https://wa.me/" + CONFIG.whatsapp.intl.replace(/\D/g, "");
        document.getElementById("waLink").href = base;
        document.getElementById("waHead").href = base;
        document.querySelectorAll(".waAct").forEach((a) => {
          a.href = base + "?text=" + encodeURIComponent(t("act.msg"));
        });
        // report button: prefilled message that mentions the current page
        const msg = t("report.msg").replace("{page}", t("nav." + currentRoute));
        document.getElementById("reportBtn").href = base + "?text=" + encodeURIComponent(msg);
      }

      function applyLang() {
        const h = document.documentElement;
        h.lang = LANG;
        h.dir = LANG === "ar" ? "rtl" : "ltr";
        const year = new Date().getFullYear();
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n).replace("{year}", year);
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
          el.innerHTML = t(el.dataset.i18nHtml);
        });
        document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
          el.placeholder = t(el.dataset.i18nPh);
        });
        document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
          el.setAttribute("aria-label", t(el.dataset.i18nAria));
        });
        document.getElementById("metaDesc").setAttribute("content", t("meta"));
        const lb = document.getElementById("langBtn");
        lb.textContent = t("lang.other");
        lb.setAttribute("aria-label", t("lang.aria"));
        renderFeatures();
        renderTutorials();
        renderGallery();
        renderSocial();
        setWhatsApp();
        hydrateIcons();
        document.title = t("title." + currentRoute);
        closeModal(true);
      }
      document.getElementById("langBtn").addEventListener("click", () => {
        LANG = LANG === "ar" ? "en" : "ar";
        try {
          localStorage.setItem("cashier-lang", LANG);
        } catch (e) {}
        applyLang();
      });

      /* =========================================================
   DOWNLOAD HANDLING
   ========================================================= */
      const modal = document.getElementById("modal");
      let lastFocus = null;
      function openModal(key) {
        lastFocus = document.activeElement;
        document.getElementById("mText").textContent = t("modal.text").replace("{name}", t("modal." + key));
        modal.classList.add("open");
        document.getElementById("mClose").focus();
      }
      function closeModal(silent) {
        if (!modal.classList.contains("open")) return;
        modal.classList.remove("open");
        if (!silent && lastFocus) lastFocus.focus();
      }
      document.getElementById("mClose").addEventListener("click", () => closeModal());
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-download]");
        if (!btn) return;
        const key = btn.dataset.download;
        const url = CONFIG.downloads[key];
        if (hasUrl(url)) {
          const a = document.createElement("a");
          a.href = url;
          a.rel = "noopener";
          a.target = "_blank";
          a.download = "";
          document.body.appendChild(a);
          a.click();
          a.remove();
        } else {
          openModal(key);
        }
      });

      /* =========================================================
   HASH ROUTER (5 pages)
   ========================================================= */
      const ROUTES = ["home", "features", "tutorials", "faq", "download"];
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";

      function router() {
        let route = location.hash.replace(/^#/, "").toLowerCase();
        if (!ROUTES.includes(route)) {
          route = "home";
          // unknown/empty hash falls back to #home (try/catch: some sandboxed previews block history changes)
          try {
            history.replaceState(null, "", "#home");
          } catch (e) {}
        }
        currentRoute = route;
        document.querySelectorAll(".page").forEach((p) => {
          p.classList.toggle("active", p.dataset.page === route);
        });
        document.querySelectorAll("[data-route]").forEach((a) => {
          const on = a.dataset.route === route;
          a.classList.toggle("active", on);
          if (on) a.setAttribute("aria-current", "page");
          else a.removeAttribute("aria-current");
        });
        document.title = t("title." + route);
        setWhatsApp();
        window.scrollTo(0, 0);
        document.getElementById("main").focus({ preventScroll: true });
      }
      window.addEventListener("hashchange", router);

      /* =========================================================
   INIT
   ========================================================= */
      hydrateIcons();
      renderScreenshot();
      applyLang();
      router();
    </script>
  </body>
</html>
